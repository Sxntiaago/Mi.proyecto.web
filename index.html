<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Buzón CUC Escucha</h1>
        <p>Tu opinión ayuda a mejorar nuestra Universidad</p>
    </header>

    <main>
        <section class="contenedor">
            <h2>Registrar una sugerencia</h2>

            <p class="descripcion">
                Comparte tus ideas y sugerencias sobre bienestar, servicios,
                clases, inclusión, espacios y procesos académicos.
            </p>

            <form>
                <div class="grupo">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej. Laura Gómez"
                        required>
                </div>

                <div class="grupo">
                    <label for="codigo">Código estudiantil</label>
                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="Ej. 202600123"
                        required>
                </div>

                <div class="grupo">
                    <label for="correo">Correo institucional</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="usuario@cuc.edu.co"
                        required>
                </div>

                <div class="grupo">
                    <label for="categoria">Categoría de la sugerencia</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una opción</option>
                        <option value="bienestar">Bienestar</option>
                        <option value="servicios">Servicios</option>
                        <option value="clases">Clases</option>
                        <option value="inclusion">Inclusión</option>
                        <option value="espacios">Espacios</option>
                        <option value="procesos">Procesos académicos</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="asunto">Asunto</label>
                    <input
                        type="text"
                        id="asunto"
                        name="asunto"
                        placeholder="Escribe el tema de tu sugerencia"
                        required>
                </div>

                <div class="grupo">
                    <label for="sugerencia">Sugerencia</label>
                    <textarea
                        id="sugerencia"
                        name="sugerencia"
                        rows="5"
                        placeholder="Describe tu idea o sugerencia..."
                        required></textarea>
                </div>

                <button type="submit">Enviar sugerencia</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Buzón CUC Escucha | Universidad de la Costa</p>
    </footer>

</body>
</html>
